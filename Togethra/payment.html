<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - TogetherA+</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="payment.css">
</head>


    <!-- Payment Section -->
    <div class="payment-container">
        <h1>Payment</h1>
        <p class="description">Complete your payment below to confirm your booking.</p>

        <!-- Payment Summary -->
        <div class="payment-summary">
            <h2>Payment Summary</h2>
            <p><strong>Helper Service:</strong> Sign Language Assistance</p>
            <p><strong>Total Price:</strong> $50</p>
        </div>

        <!-- Payment Method -->
        <div class="payment-method-section">
            <h2>Select Payment Method</h2>
            <label class="payment-option">
                <input type="radio" name="payment-method" value="sslcommerz" required>
                <span>Pay Online (Credit/Debit Card / bKash / Nagad / Rocket)</span>
                <p class="verified-by">Verified by <img src="resource/sslcomm.png" alt="SSLCommerz"></p>
            </label>
        </div>

        <!-- Submit Button -->
        <button class="pay-now-btn">Pay $50</button>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 TogetherA+. All rights reserved.</p>
    </footer>

</body>

</html>
