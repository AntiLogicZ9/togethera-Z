<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Task - TogetherA+</title>
    <link rel="stylesheet" href="styles.css"> <!-- Common styles -->
    <link rel="stylesheet" href="task-posting.css"> <!-- Task-specific styles -->
</head>

<body>

    <header>
        <div class="logo">
            <img src="img/logo.png" alt="TogetherA+">
        </div>
        <nav>
            <ul>
                <li><a href="homepage.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="tasks.html">Tasks</a></li>
                <li><a href="resources.html">Resources</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="trusted-contacts.html">Trusted Contacts</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Task Posting Form -->
    <div class="task-container">
        <h1>Post a Task</h1>
        <p class="description">
            Fill out the form below to post a task and connect with a helper. Provide as much detail as possible to
            ensure the best match.
        </p>
        <form>
            <!-- Task Title -->
            <div class="form-group">
                <label for="task-title">Task Title</label>
                <input type="text" id="task-title" placeholder="e.g., Sign Language Assistance" required />
            </div>

            <!-- Task Description -->
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" placeholder="Describe the task in detail" required></textarea>
            </div>

            <!-- Payment Options -->
            <div class="form-group">
                <label>Payment Option</label>
                <div class="payment-options">
                    <label>
                        <input type="radio" name="payment" value="hourly" id="hourly-option" checked />
                        Hourly Rate
                    </label>
                    <label>
                        <input type="radio" name="payment" value="fixed" id="fixed-option" />
                        Fixed Rate
                    </label>
                </div>
            </div>

            <!-- Hourly Rate -->
            <div class="form-group">
                <label for="hourly-rate">Hourly Rate ($)</label>
                <input type="number" id="hourly-rate" placeholder="Enter hourly rate" />
            </div>

            <!-- Fixed Rate -->
            <div class="form-group">
                <label for="fixed-rate">Fixed Rate ($)</label>
                <input type="number" id="fixed-rate" placeholder="Enter fixed rate" disabled />
            </div>

            <!-- Duration -->
            <div class="form-group">
                <label for="duration">Duration</label>
                <div class="duration-fields">
                    <input type="number" id="days" placeholder="Days" disabled />
                    <input type="number" id="hours" placeholder="Hours per day" disabled />
                </div>
            </div>

            <!-- Task Type -->
            <div class="form-group">
                <label for="task-type">Task Type</label>
                <select id="task-type" required>
                    <option value="" disabled selected>Select task type</option>
                    <option value="sign-language">Sign Language Assistance</option>
                    <option value="reading-help">Reading and Note-taking</option>
                    <option value="outdoor-guidance">Outdoor Guidance</option>
                </select>
            </div>

            <!-- Location -->
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" placeholder="e.g., New York City (optional)" />
            </div>

            <!-- Urgency -->
            <div class="form-group">
                <label for="urgency">Urgency</label>
                <select id="urgency" required>
                    <option value="" disabled selected>Select urgency</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

            <!-- Submit Button -->
            <button type="submit">Post Task</button>
        </form>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 TogetherA+. All rights reserved.</p>
    </footer>

    <script src="task-posting.js"></script> <!-- JS for Payment Toggle -->
</body>

</html>
